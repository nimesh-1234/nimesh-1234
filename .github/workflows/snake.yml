name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # හැමදාම රෑ 12 ට auto run වෙනවා

  workflow_dispatch: # අපිට ඕන වෙලාවට manual run කරන්න පුළුවන්

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: nimesh-1234
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
